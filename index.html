<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carnet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f3f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --ink:#1c1c1e; --muted:#8a8a8e; --line:#e3e3e8; --bar:rgba(250,250,252,.92);
  --desk:#e9e8ed; --accent:#f5a524; --accent-ink:#7a4d00; --danger:#e0352b;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--desk);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit}
[hidden]{display:none!important}

/* ---------- Library ---------- */
#lib{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f4f3f7}
.lib-head{position:sticky;top:0;z-index:2;background:rgba(244,243,247,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(22px + env(safe-area-inset-top)) 28px 14px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lib-head h1{margin:0;font-size:34px;letter-spacing:-.02em;font-weight:750;flex:1}
.status{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:#b8b8bd;display:inline-block}
.status.ok i{background:#34c759}.status.saving i{background:var(--accent)}.status.err i{background:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px}
.btn-primary{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 22px;padding:12px 28px 60px}
.card{display:flex;flex-direction:column;gap:9px;text-align:left;position:relative}
.cover{aspect-ratio:1/1.32;border-radius:6px 14px 14px 6px;position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 22px -8px rgba(0,0,0,.28);transition:transform .15s}
.card:active .cover{transform:scale(.97)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12%;background:rgba(0,0,0,.14)}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 45%)}
.cover .label{position:absolute;left:22%;right:10%;top:16%;background:rgba(255,255,255,.92);border-radius:6px;padding:8px 9px;
  font-size:13px;font-weight:650;line-height:1.2;color:#222;word-break:break-word;max-height:58%;overflow:hidden}
.card-title{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.card-meta{font-size:12.5px;color:var(--muted);margin-top:-6px}
.card-more{position:absolute;right:-4px;bottom:16px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.card-more:active{background:rgba(0,0,0,.06)}
.new-card .cover{background:transparent;border:2px dashed #c7c7cc;box-shadow:none;display:grid;place-items:center;color:#8e8e93}
.new-card .cover::before,.new-card .cover::after{display:none}
.empty{padding:40px 28px;color:var(--muted);font-size:15px}
.crumbs{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.crumbs .back{margin-left:-8px;margin-bottom:-2px;font-size:15px}
.crumbs h1{flex:none;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{grid-column:1/-1;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 -12px}
.folder{aspect-ratio:1/.82;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .15s}
.card:active .folder{transform:scale(.97)}
.folder svg{width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
.folder .count{position:absolute;left:0;right:0;top:56%;text-align:center;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.dest{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto;margin:6px -6px 0}
.dest button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left}
.dest button:active{background:#f2f2f5}
.dest button.on{background:#fdf1dc;color:var(--accent-ink);font-weight:600}
.dest button[disabled]{opacity:.35}

/* ---------- Editor ---------- */
#ed{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:8px 10px;flex-wrap:wrap;z-index:5;padding-top:max(8px,env(safe-area-inset-top))}
.bar-left,.bar-right{display:flex;align-items:center;gap:2px}
.bar-left{flex:1;min-width:0}
.bar-right{flex:1;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#3a3a3c;flex:none}
.ib:active{background:rgba(0,0,0,.07)}
.ib[disabled]{opacity:.3;pointer-events:none}
.back{display:flex;align-items:center;gap:2px;color:#b7791f;font-weight:600;padding:8px 6px;border-radius:10px;font-size:16px;flex:none}
.title-btn{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px;border-radius:10px;min-width:0}
.title-btn:active{background:rgba(0,0,0,.06)}
.tools{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;flex:none;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{width:42px;height:40px;border-radius:10px;display:grid;place-items:center;color:#48484a;flex:none;position:relative}
.tool.on{background:#fdf1dc;color:var(--accent-ink)}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px;flex:none}
.sw{width:28px;height:28px;border-radius:50%;flex:none;position:relative;margin:0 2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--accent)}
.sw-custom{background:conic-gradient(#f44,#fd0,#4c4,#0cf,#55f,#f4f,#f44);overflow:hidden}
.sw-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.sz{width:34px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.sz span{background:#48484a;border-radius:50%;display:block}
.sz.on{background:#f2f2f5}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;left:0;top:0;touch-action:none}
.pager{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;
  display:flex;align-items:center;gap:2px;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 6px 24px -10px rgba(0,0,0,.3)}
.pager .ib{border-radius:999px;width:38px;height:38px}
.pager .pn{font-size:14px;font-weight:600;min-width:86px;text-align:center;font-variant-numeric:tabular-nums}
.pager .add{display:flex;align-items:center;gap:4px;padding:0 14px 0 10px;height:38px;border-radius:999px;font-weight:600;font-size:14px;background:var(--ink);color:#fff;margin-left:4px}

/* ---------- Popover / modal ---------- */
.pop{position:fixed;z-index:30;background:#fff;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 20px 50px -12px rgba(0,0,0,.35);
  padding:8px;min-width:260px;max-width:calc(100vw - 20px)}
.pop .row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-size:15px;width:100%;text-align:left}
.pop button.row:active{background:#f2f2f5}
.pop .row.danger{color:var(--danger)}
.pop .hr{height:1px;background:var(--line);margin:6px 4px}
.pop .cap{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 12px 4px}
.papers{display:flex;gap:8px;padding:4px 10px 8px}
.paper-opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#48484a}
.paper-opt .pv{width:48px;height:62px;border-radius:5px;border:1px solid var(--line);background:#fff;background-size:8px 8px}
.paper-opt.on .pv{outline:2.5px solid var(--accent);outline-offset:2px}
.pv.lines{background-image:linear-gradient(#c9d7ea 1px,transparent 1px);background-size:100% 8px;background-position:0 12px}
.pv.grid{background-image:linear-gradient(#dde3ec 1px,transparent 1px),linear-gradient(90deg,#dde3ec 1px,transparent 1px)}
.pv.dots{background-image:radial-gradient(#b0b8c4 1px,transparent 1.3px)}
.toggle{margin-left:auto;width:46px;height:28px;border-radius:999px;background:#d1d1d6;position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:#34c759}.toggle.on::after{transform:translateX(18px)}
.scrim{position:fixed;inset:0;z-index:20}
.modal-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:20px;width:min(440px,100%);padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
.modal h2{margin:0 0 6px;font-size:20px}
.modal p{margin:0 0 14px;color:#555;font-size:15px;line-height:1.45}
.modal .field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #d1d1d6;font-size:16px;margin:6px 0 14px;-webkit-user-select:text;user-select:text}
.modal .lbl{font-size:13px;font-weight:600;color:#555;margin-top:4px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.covers{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.covers .sw{width:34px;height:34px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:rgba(28,28,30,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
  .bar-left{order:1}.bar-right{order:2;flex:0}.tools{order:3;width:100%;justify-content:flex-start}
  .lib-head{padding:18px 18px 12px}.lib-head h1{font-size:28px}.grid{padding:10px 18px 60px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:22px 16px}
}
</style>
</head>
<body>

<!-- Library -->
<section id="lib">
  <div class="lib-head">
    <div class="crumbs">
      <button class="back" id="lib-up" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="lib-up-label">Mes carnets</span></button>
      <h1 id="lib-title">Mes carnets</h1>
    </div>
    <span class="status" id="status-lib" hidden><i></i><span>Sur cet appareil</span></span>
    <button class="btn btn-ghost" id="lib-menu" aria-label="Sauvegarde" style="padding:10px 12px"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>
    <input type="file" id="restore-file" accept=".json,application/json" hidden>
    <button class="btn btn-ghost" id="new-folder">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10.5v5M9.5 13h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Dossier</button>
    <button class="btn btn-primary" id="new-nb">
      <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Nouveau carnet</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<!-- Editor -->
<section id="ed" hidden>
  <div class="bar">
    <div class="bar-left">
      <button class="back" id="back">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Carnets</button>
      <button class="title-btn" id="title-btn"></button>
    </div>
    <div class="tools" id="tools"></div>
    <div class="bar-right">
      <span class="status" id="status-ed" hidden><i></i><span></span></span>
      <button class="ib" id="undo" title="Annuler"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ib" id="redo" title="Rétablir"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="ib" id="more" title="Options"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <canvas id="lv"></canvas>
    <div class="pager">
      <button class="ib" id="prev"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="pn" id="pn">1 / 1</span>
      <button class="ib" id="next"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="add" id="addpage"><svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Page</button>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(async () => {
"use strict";
/* ===== Stockage sur l'appareil : IndexedDB (grande capacité) + cache mémoire ===== */
const mem = new Map(); let idb = null;
function idbOpen(){
  return new Promise((res) => {
    try {
      const r = indexedDB.open("carnet", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
}
async function storeInit(){
  idb = await idbOpen();
  if (idb) await new Promise((res) => {
    const tx = idb.transaction("kv", "readonly"), st = tx.objectStore("kv"), req = st.openCursor();
    req.onsuccess = () => { const c = req.result; if (c) { mem.set(c.key, c.value); c.continue(); } };
    tx.oncomplete = res; tx.onerror = res;
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
function idbPut(k, v){
  if (!idb) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast("Stockage de l'appareil plein"); } return; }
  try { const tx = idb.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.onerror = () => toast("Enregistrement impossible : stockage plein ?"); }
  catch (e) { toast("Enregistrement impossible"); }
}
function idbDel(k){ if (idb) { try { idb.transaction("kv", "readwrite").objectStore("kv").delete(k); } catch (e) {} } else { try { localStorage.removeItem(k); } catch (e) {} } }
await storeInit();
if (!idb) { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("nbk.") && k !== "nbk.settings") mem.set(k, JSON.parse(localStorage.getItem(k))); } } catch (e) {} }
const W = 1000, H = 1414; // page logique (format A4)
const PEN_COLORS = ["#1c1c1e", "#0a64d8", "#e0352b", "#1f9d55", "#8e44ad"];
const HL_COLORS  = ["#ffd60a", "#7ee081", "#ff8ac2", "#7cc4ff", "#ffb066"];
const SIZES = { pen: [2.2, 3.6, 6.5], hl: [16, 24, 36], er: [10, 22, 44] };
const COVERS = ["#2f6fdf", "#e0533b", "#1f9d6b", "#f5a524", "#7b4fd6", "#3a3a3c", "#e46fa8", "#1aa3b8"];
const PAPERS = [["blank","Blanc"],["lines","Ligné"],["grid","Carreaux"],["dots","Points"]];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ================= Stockage local ================= */
const LS = {
  get(k){
    if (k === "nbk.settings") { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
    return mem.has(k) ? mem.get(k) : null;
  },
  set(k,v){
    if (k === "nbk.settings") { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} return true; }
    mem.set(k, v); idbPut(k, v); return true;
  },
  del(k){ mem.delete(k); idbDel(k); }
};
let S = LS.get("nbk.index") || { notebooks: [], folders: [], updated: 0 };
if (!Array.isArray(S.folders)) S.folders = [];
let curFolder = null; // dossier ouvert dans la bibliothèque (null = racine)
const settings = Object.assign({
  stylusOnly: false, tool: "pen",
  pen: { color: PEN_COLORS[0], size: 1 }, hl: { color: HL_COLORS[0], size: 1 }, er: { size: 1 }
}, LS.get("nbk.settings") || {});
const saveSettings = () => LS.set("nbk.settings", settings);

/* Encodage compact des points (Int16 → base64) */
function enc(pts){
  const a = new Int16Array(pts.length);
  for (let i = 0; i < pts.length; i++){
    const m = (i % 3 === 2) ? 1000 : 10;
    a[i] = Math.max(-32768, Math.min(32767, Math.round(pts[i] * m)));
  }
  const b = new Uint8Array(a.buffer); let s = "";
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function dec(str){
  const bin = atob(str), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  const a = new Int16Array(b.buffer, 0, b.length >> 1), out = new Array(a.length);
  for (let i = 0; i < a.length; i++) out[i] = a[i] / ((i % 3 === 2) ? 1000 : 10);
  return out;
}
const serializePage = (p) => ({ u: p.updated || 0, s: p.strokes.map(st => ({ t: st.tool, c: st.color, w: st.size, r: st.pr ? 1 : 0, d: enc(st.pts) })) });
function deserializePage(o){
  const strokes = [];
  for (const x of (o && o.s) || []) {
    try { strokes.push({ tool: x.t === "hl" ? "hl" : "pen", color: String(x.c || "#000"), size: +x.w || 3, pr: !!x.r, pts: dec(String(x.d || "")) }); } catch(e){}
  }
  return { strokes, updated: (o && +o.u) || 0 };
}

const pages = {};
function getPage(pid){
  if (!pages[pid]) {
    const raw = LS.get("nbk.p." + pid);
    pages[pid] = raw ? deserializePage(raw) : { strokes: [], updated: 0 };
  }
  return pages[pid];
}
const localTimers = {};
function saveLocalSoon(key, fn){ clearTimeout(localTimers[key]); localTimers[key] = setTimeout(fn, 350); }
function saveIndexLocal(){ if (!LS.set("nbk.index", S)) toast("Stockage de l'appareil plein"); }
function savePageLocal(pid){ if (pages[pid]) LS.set("nbk.p." + pid, serializePage(pages[pid])); }

/* ================= Synchronisation (compte Claude) ================= */
const cloud = { col: null, on: false };
const dirty = new Set(); let flushTimer = null, flushing = false;
const fetched = new Set();

function setStatus(kind){
  const txt = { local: "Sur cet appareil", sync: "Connexion…", ok: "Synchronisé", saving: "Enregistrement…", err: "Hors ligne · réessai" }[kind];
  for (const id of ["status-lib", "status-ed"]) {
    const el = $(id); el.className = "status " + kind; el.querySelector("span").textContent = txt;
  }
}
function markDirty(k){
  dirty.add(k);
  if (!cloud.on) return;
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500);
  setStatus("saving");
}
async function writeDoc(k){
  if (k.startsWith("del-")) return cloud.col.doc("pg-" + k.slice(4)).delete();
  let body;
  if (k === "index") body = { notebooks: S.notebooks, folders: S.folders, updated: S.updated };
  else body = serializePage(getPage(k.slice(3)));
  return cloud.col.doc(k).set(body);
}
async function flush(){
  if (flushing || !cloud.on || !dirty.size) { if (cloud.on && !dirty.size && !flushing) setStatus("ok"); return; }
  flushing = true; let failed = false;
  try {
    while (dirty.size) {
      const k = dirty.values().next().value; dirty.delete(k);
      try { await writeDoc(k); }
      catch (e) {
        if (e && e.code === "unavailable") { await sleep(700 + Math.random() * 800); try { await writeDoc(k); continue; } catch(e2){} }
        if (e && (e.code === "quota_exceeded" || e.code === "invalid_argument")) {
          toast(k.startsWith("pg-") ? "Page trop chargée pour la synchro — elle reste sur cet appareil" : "Synchronisation impossible");
          continue;
        }
        if (e && (e.code === "revoked" || e.code === "not_granted")) { cloud.on = false; setStatus("local"); flushing = false; return; }
        dirty.add(k); failed = true; break;
      }
    }
  } finally { flushing = false; }
  if (failed) { setStatus("err"); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 20000); }
  else if (dirty.size) flush(); else setStatus("ok");
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]); }

async function cloudInit(){
  if (!(window.claude && typeof window.claude.use === "function")) { setStatus("local"); return; }
  setStatus("sync");
  try {
    const db = await claude.use("db"); const user = await claude.use("user");
    if (!db || !user) { setStatus("local"); return; }
    const uid = await user.id();
    if (!uid) { setStatus("local"); return; }
    cloud.col = db.collection("data/users/" + uid);
    const snap = await withTimeout(cloud.col.doc("index").get(), 10000);
    const remote = snap.exists ? snap.data() : null;
    cloud.on = true;
    if (remote && (+remote.updated || 0) > S.updated) {
      S = { notebooks: Array.isArray(remote.notebooks) ? JSON.parse(JSON.stringify(remote.notebooks)) : [],
            folders: Array.isArray(remote.folders) ? JSON.parse(JSON.stringify(remote.folders)) : [], updated: +remote.updated || 0 };
      if (curFolder && !S.folders.find(f => f.id === curFolder)) curFolder = null;
      saveIndexLocal();
      if (cur && !S.notebooks.find(n => n.id === cur.nb.id)) closeEditor();
      else if (cur) { cur.nb = S.notebooks.find(n => n.id === cur.nb.id); cur.idx = Math.min(cur.idx, cur.nb.pages.length - 1); }
      renderLib();
    } else if (!remote || S.updated > (+remote.updated || 0)) {
      dirty.add("index");
      for (const nb of S.notebooks) for (const pid of nb.pages) dirty.add("pg-" + pid);
    }
    if (cur) { showPage(); }
    if (dirty.size) { setStatus("saving"); flush(); } else setStatus("ok");
  } catch (e) {
    setStatus(cloud.on ? "err" : "local");
  }
}
async function fetchPage(pid){
  if (!cloud.on || fetched.has(pid)) return;
  fetched.add(pid);
  try {
    const snap = await withTimeout(cloud.col.doc("pg-" + pid).get(), 10000);
    if (!snap.exists) return;
    const remote = deserializePage(snap.data()), local = getPage(pid);
    if (remote.updated > (local.updated || 0)) {
      pages[pid] = remote; savePageLocal(pid);
      if (cur && curPid() === pid) { pathCache = new WeakMap(); redraw(); }
    }
  } catch (e) { fetched.delete(pid); }
}

function touchIndex(){ S.updated = Date.now(); saveLocalSoon("index", saveIndexLocal); markDirty("index"); }
function touchPage(pid){
  const p = getPage(pid), now = Date.now();
  p.updated = now; if (cur) cur.nb.updated = now;
  saveLocalSoon("p" + pid, () => savePageLocal(pid));
  markDirty("pg-" + pid); touchIndex();
}

/* ================= UI utilitaires ================= */
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

function modal({ title, text = "", html = "", buttons }){
  const sc = document.createElement("div"); sc.className = "modal-scrim";
  sc.innerHTML = `<div class="modal"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}${html}<div class="acts"></div></div>`;
  const acts = sc.querySelector(".acts");
  const close = () => sc.remove();
  for (const b of buttons) {
    const el = document.createElement("button"); el.className = "btn " + (b.cls || "btn-ghost"); el.textContent = b.label;
    el.onclick = () => { if (b.onClick && b.onClick(sc) === false) return; close(); };
    acts.appendChild(el);
  }
  sc.addEventListener("pointerdown", e => { if (e.target === sc) close(); });
  document.body.appendChild(sc);
  const f = sc.querySelector("input.field"); if (f) setTimeout(() => { f.focus(); f.select(); }, 50);
  return sc;
}
function popover(anchor, build){
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const pop = document.createElement("div"); pop.className = "pop";
  const close = () => { scrim.remove(); pop.remove(); };
  build(pop, close);
  scrim.addEventListener("pointerdown", close);
  document.body.append(scrim, pop);
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = Math.min(window.innerWidth - pw - 10, Math.max(10, r.right - pw));
  let top = r.bottom + 8; if (top + ph > window.innerHeight - 10) top = Math.max(10, r.top - ph - 8);
  pop.style.left = left + "px"; pop.style.top = top + "px";
  return close;
}

  return d.toDateString() === now.toDateString() ? "Aujourd'hui, " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: d.getFullYear() === now.getFullYear() ? undefined : "numeric" }); };

const folderById = (id) => S.folders.find(f => f.id === id);
const folderPath = (id) => { const out = []; let f = folderById(id), guard = 0; while (f && guard++ < 50) { out.unshift(f.name); f = folderById(f.parent); } return out.join(" › "); };
function folderCount(id){
  let n = S.notebooks.filter(nb => nb.folder === id).length;
  for (const f of S.folders) if (f.parent === id) n += folderCount(f.id);
  return n;
}
function isInside(id, ancestor){ let f = folderById(id), guard = 0; while (f && guard++ < 50) { if (f.id === ancestor) return true; f = folderById(f.parent); } return false; }
function openFolder(id){ curFolder = id; renderLib(); $("lib").scrollTop = 0; }

      <div class="card-title">${esc(nb.title)}</div>

    c.querySelector(".cover").onclick = () => openNotebook(nb.id);
    c.querySelector(".card-more").onclick = (e) => popover(e.currentTarget, (pop, close) => {
      pop.innerHTML = `<button class="row" data-a="ren">Renommer</button><button class="row" data-a="col">Changer la couverture</button><button class="row" data-a="mv">Déplacer vers un dossier…</button><div class="hr"></div><button class="row danger" data-a="del">Supprimer le carnet</button>`;
      pop.onclick = (ev) => { const a = ev.target.closest("[data-a]")?.dataset.a; if (!a) return; close();

function folderDialog(f){
  const isNew = !f;
  let color = f ? f.color : COVERS[S.folders.length % COVERS.length];
  const sc = modal({ title: isNew ? "Nouveau dossier" : "Renommer le dossier",
    html: `<div class="lbl">Nom</div><input class="field" maxlength="50" value="${esc(f ? f.name : "")}" placeholder="Ex. Calcul stochastique">${isNew ? `<div class="lbl">Couleur</div>${coversHtml(color)}` : ""}`,
    buttons: [{ label: "Annuler" }, { label: isNew ? "Créer" : "OK", cls: "btn-primary", onClick: (sc) => {
      const v = sc.querySelector(".field").value.trim(); if (!v) { sc.querySelector(".field").focus(); return false; }
      if (isNew) S.folders.push({ id: newId(), name: v, color, parent: curFolder, created: Date.now() });
      else f.name = v;
      touchIndex(); saveIndexLocal(); renderLib();
    } }] });
  if (isNew) bindCovers(sc, c => color = c);
  sc.querySelector(".field").addEventListener("keydown", e => { if (e.key === "Enter") sc.querySelector(".btn-primary").click(); });
}
function deleteFolderDialog(f){
  const n = folderCount(f.id);
  modal({ title: "Supprimer le dossier « " + f.name + " » ?",
    text: n ? `Les ${n} carnet${n > 1 ? "s" : ""} qu'il contient ne seront pas supprimés : ils remonteront d'un niveau.` : "Le dossier est vide.",
    buttons: [{ label: "Annuler" }, { label: "Supprimer le dossier", cls: "btn-danger", onClick: () => {
      const up = f.parent || null;
      for (const nb of S.notebooks) if (nb.folder === f.id) nb.folder = up;
      for (const s of S.folders) if (s.parent === f.id) s.parent = up;
      S.folders = S.folders.filter(x => x !== f);
      touchIndex(); saveIndexLocal(); renderLib();
    } }] });
}
function moveDialog(item, kind){
  const current = kind === "nb" ? (item.folder || null) : (item.parent || null);
  let target = current;
  const ordered = []; // arborescence
  const walk = (parent, depth) => S.folders.filter(f => (f.parent || null) === parent).sort((a, b) => a.name.localeCompare(b.name, "fr"))
    .forEach(f => { ordered.push({ f, depth }); walk(f.id, depth + 1); });
  walk(null, 0);
  const icon = (c) => `<svg width="22" height="18" viewBox="0 0 24 20"><path d="M1 3a2 2 0 012-2h6l2 2h10a2 2 0 012 2v12a2 2 0 01-2 2H3a2 2 0 01-2-2z" fill="${esc(c)}"/></svg>`;
  const rows = [`<button data-id="" class="${current === null ? "on" : ""}">${icon("#8e8e93")}Mes carnets (racine)</button>`]
    .concat(ordered.map(({ f, depth }) => {
      const bad = kind === "folder" && (f.id === item.id || isInside(f.id, item.id));
      return `<button data-id="${f.id}" class="${current === f.id ? "on" : ""}" ${bad ? "disabled" : ""} style="padding-left:${12 + depth * 22}px">${icon(f.color)}${esc(f.name)}</button>`;
    }));
  const sc = modal({ title: "Déplacer « " + (item.title || item.name) + " »",
    html: ordered.length ? `<div class="dest">${rows.join("")}</div>` : `<p>Tu n'as pas encore de dossier. Crée-en un d'abord avec le bouton « Dossier ».</p>`,
    buttons: ordered.length ? [{ label: "Annuler" }, { label: "Déplacer", cls: "btn-primary", onClick: () => {
      if (target === current) return;
      if (kind === "nb") item.folder = target; else item.parent = target;
      touchIndex(); saveIndexLocal(); renderLib();
      toast("Déplacé dans " + (target ? folderById(target).name : "Mes carnets"));
    } }] : [{ label: "OK", cls: "btn-primary" }] });
  sc.querySelectorAll(".dest button").forEach(b => b.onclick = () => {
    sc.querySelectorAll(".dest button").forEach(x => x.classList.remove("on")); b.classList.add("on"); target = b.dataset.id || null; });
}
function coversHtml(sel){ return `<div class="covers">${COVERS.map(c => `<button class="sw ${c === sel ? "on" : ""}" data-c="${c}" style="background:${c}"></button>`).join("")}</div>`; }
function bindCovers(sc, onPick){ sc.querySelectorAll(".covers .sw").forEach(b => b.onclick = () => { sc.querySelectorAll(".covers .sw").forEach(x => x.classList.remove("on")); b.classList.add("on"); onPick(b.dataset.c); }); }
function papersHtml(sel){ return `<div class="papers" style="padding:6px 0 4px">${PAPERS.map(([k, l]) => `<button class="paper-opt ${k === sel ? "on" : ""}" data-p="${k}"><div class="pv ${k}"></div>${l}</button>`).join("")}</div>`; }
function bindPapers(root, onPick){ root.querySelectorAll(".paper-opt").forEach(b => b.onclick = () => { root.querySelectorAll(".paper-opt").forEach(x => x.classList.remove("on")); b.classList.add("on"); onPick(b.dataset.p); }); }

/* ================= Éditeur ================= */
let cur = null; // { nb, idx }
const curPid = () => cur.nb.pages[cur.idx];
const hist = {}; // pid -> {u:[], r:[]}
const H_ = (pid) => (hist[pid] ||= { u: [], r: [] });

function openNotebook(id){
  const nb = S.notebooks.find(n => n.id === id); if (!nb) return;
  cur = { nb, idx: Math.min(nb.lastPage || 0, nb.pages.length - 1) };
  $("lib").hidden = true; $("ed").hidden = false;
  $("title-btn").textContent = nb.title;
  buildTools(); resize(true); showPage();
}
function closeEditor(){
  if (cur) curFolder = (cur.nb.folder && folderById(cur.nb.folder)) ? cur.nb.folder : null;
  cur = null; $("ed").hidden = true; $("lib").hidden = false; renderLib();
}
function showPage(){
  if (!cur) return;
  const pid = curPid(); getPage(pid);
  $("pn").textContent = `${cur.idx + 1} / ${cur.nb.pages.length}`;
  $("prev").disabled = cur.idx === 0; $("next").disabled = cur.idx === cur.nb.pages.length - 1;
  if (cur.nb.lastPage !== cur.idx) { cur.nb.lastPage = cur.idx; saveLocalSoon("index", saveIndexLocal); }
  updateUndo(); redraw(); fetchPage(pid);
  // précharge les pages voisines
  for (const d of [-1, 1]) { const p = cur.nb.pages[cur.idx + d]; if (p) { getPage(p); fetchPage(p); } }
}
function goPage(i){ if (!cur) return; i = Math.max(0, Math.min(cur.nb.pages.length - 1, i)); if (i === cur.idx) return; cancelLive(); cur.idx = i; fitView(); showPage(); }
function addPage(){
  const pid = newId(); pages[pid] = { strokes: [], updated: Date.now() };
  cur.nb.pages.splice(cur.idx + 1, 0, pid); savePageLocal(pid); markDirty("pg-" + pid);
  cur.nb.updated = Date.now(); touchIndex(); cur.idx++; fitView(); showPage();
}

function buildTools(){
  const t = $("tools"), tool = settings.tool;

    if (!data || data.app !== "carnet" || !data.index || !Array.isArray(data.index.notebooks)) { toast("Ce n'est pas une sauvegarde de Carnet"); return; }
    const nNb = data.index.notebooks.length;
    modal({ title: "Restaurer la sauvegarde ?", text: `Elle contient ${nNb} carnet${nNb > 1 ? "s" : ""}. Les carnets et dossiers de la sauvegarde seront ajoutés ou mis à jour ; ceux qui n'y figurent pas seront conservés.`,
      buttons: [{ label: "Annuler" }, { label: "Restaurer", cls: "btn-primary", onClick: () => {
        for (const pid in (data.pages || {})) { pages[pid] = deserializePage(data.pages[pid]); savePageLocal(pid); }
        for (const f of (data.index.folders || [])) { const i = S.folders.findIndex(x => x.id === f.id); if (i >= 0) S.folders[i] = f; else S.folders.push(f); }
        for (const nb of data.index.notebooks) { const i = S.notebooks.findIndex(x => x.id === nb.id); if (i >= 0) S.notebooks[i] = nb; else S.notebooks.push(nb); }
        touchIndex(); saveIndexLocal(); curFolder = null; renderLib(); toast("Sauvegarde restaurée");
      } }] });
  };
  rd.readAsText(file);
}
async function exportPNG(){
  const c = renderOff(curPid(), 2);
  c.toBlob(b => b && saveFile(`${safeName(cur.nb.title)} - page ${cur.idx + 1}.png`, b), "image/png");
}
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function exportPDF(){
  toast("Préparation du PDF…");
  try {
    if (!window.jspdf) await loadScript("vendor/jspdf.umd.min.js");
    const nb = cur.nb;
    await Promise.all(nb.pages.map(fetchPage));
    const pdf = new window.jspdf.jsPDF({ unit: "pt", format: "a4", compress: true });
    nb.pages.forEach((pid, i) => {
      if (i) pdf.addPage("a4", "portrait");
      const c = renderOff(pid, 1.6);
      pdf.addImage(c.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 595.28, 841.89);
    });
    await saveFile(`${safeName(nb.title)}.pdf`, pdf.output("blob"));
  } catch (e) { toast("Export PDF impossible"); }
}

/* ---- Branchements ---- */
$("new-nb").onclick = newNotebookDialog;
$("new-folder").onclick = () => folderDialog(null);
$("lib-menu").onclick = (e) => popover(e.currentTarget, (pop, close) => {
  pop.innerHTML = `<div class="cap">Sauvegarde</div>
    <button class="row" data-a="bk">Sauvegarder tous mes carnets…</button>
    <button class="row" data-a="rs">Restaurer une sauvegarde…</button>
    <div class="hr"></div>
    <div class="row" style="font-size:13px;color:var(--muted);line-height:1.4">Tes notes sont stockées uniquement sur cet appareil. Fais une sauvegarde de temps en temps (sur Drive par exemple) pour ne rien perdre.</div>`;
  pop.onclick = (ev) => { const a = ev.target.closest("[data-a]")?.dataset.a; if (!a) return; close();
    if (a === "bk") backupAll(); if (a === "rs") $("restore-file").click(); };
});
$("restore-file").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; if (f) restoreFrom(f); e.target.value = ""; });
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
$("lib-up").onclick = () => { const f = folderById(curFolder); openFolder(f && f.parent && folderById(f.parent) ? f.parent : null); };
$("back").onclick = () => { cancelLive(); closeEditor(); };
$("title-btn").onclick = () => renameDialog(cur.nb);
$("undo").onclick = doUndo; $("redo").onclick = doRedo;
$("more").onclick = openMenu;
$("prev").onclick = () => goPage(cur.idx - 1);
$("next").onclick = () => goPage(cur.idx + 1);
$("addpage").onclick = addPage;
document.addEventListener("keydown", (e) => {
  if (!cur || document.querySelector(".modal-scrim")) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  else if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); doRedo(); }
  else if (e.key === "ArrowRight" || e.key === "PageDown") goPage(cur.idx + 1);
  else if (e.key === "ArrowLeft" || e.key === "PageUp") goPage(cur.idx - 1);
});
window.addEventListener("pagehide", () => { saveIndexLocal(); for (const pid in pages) savePageLocal(pid); if (cloud.on && dirty.size) flush(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { saveIndexLocal(); if (cloud.on && dirty.size) flush(); } });

setStatus("local");
renderLib();
cloudInit();
})();
</script>
